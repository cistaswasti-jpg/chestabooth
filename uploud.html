<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload - Chestabooth</title>

  <link rel="icon" href="Images/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="cam.css" />
  <style>
    #uploadPhotoInput { display: none; }
    #uploadPhoto, #readyButton {
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 8.5rem;
      height: 3.2rem;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="Images/Logo.png" alt="Logo">
  </div>

  <div class="photobooth-container" id="booth">
    <div class="bubble-container"></div>

    <!-- Layer 1 (Bawah): Foto yang diunggah -->
    <canvas id="finalCanvas" width="1176" height="1470"></canvas>

    <!-- Layer 2 (Atas): Bingkai photostrip-straight.png -->
    <canvas id="frameOverlayCanvas" width="1176" height="1470"></canvas>

    <input type="file" id="uploadPhotoInput" accept="image/*" />
  </div>

  <div class="controls">
    <button id="uploadPhoto">Upload Photo (1/2)</button>
    <button id="retakeBtn" style="display: none;">Reset</button>
    <button id="readyButton" disabled style="display: none;">Done</button>
  </div>

  <script src="uploud.js"></script>
  <script src="bubble.js"></script>
</body>
</html>
