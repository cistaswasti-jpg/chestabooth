<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu - Chestabooth</title>

  <!-- Favicon -->
  <link rel="icon" href="Images/favicon.png" type="image/x-icon" />
  <link rel="stylesheet" href="home.css" />
</head>
<body>
  <div class="logo">
    <img src="Images/Logo.png" alt="Logo">
  </div>

  <div class="menu-container">
    <div class="menu-card">
      <div class="menu-header"></div>
      <p class="menu-subtitle">Pilih metode foto kamu!</p>
      
      <div class="menu-buttons">
        <button id="menu-camera-button" class="menu-btn">
          <span></span> Take photos
        </button>
        <button id="menu-upload-button" class="menu-btn">
          <span></span> Upload photos
        </button>
      </div>
    </div>
    
    <!-- Hiasan Ikan & Gelembung Melayang -->
    <div class="menu-decorations">
      <div class="menu-fish-1"></div>
      <div class="menu-fish-2"></div>
      <div class="menu-bubble-1"></div>
      <div class="menu-bubble-2"></div>
    </div>
  </div>

  <script src="home.js"></script>
</body>
</html>
